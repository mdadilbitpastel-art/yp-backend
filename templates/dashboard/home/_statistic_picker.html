<div class="form-group statistic-picker-wrapper mb-0">
    {% if field.field.choices|length == 0 %}
        <div class="alert alert-warning mb-0">
            <i class="fas fa-info-circle mr-1"></i>
            No statistics yet — add some in
            <a href="{% url 'dashboard:statistics_edit' %}">Data Management → Statistics</a>
            first.
        </div>
    {% else %}
        {{ field }}
        {% if field.help_text %}
            <small class="form-text text-muted">{{ field.help_text }}</small>
        {% endif %}
    {% endif %}

    {% for error in field.errors %}
        <div class="invalid-feedback d-block">{{ error }}</div>
    {% endfor %}
</div>

<style>
    .statistic-picker-wrapper ul {
        list-style: none;
        padding: 0;
        margin: 0;
        border: 1px solid #ced4da;
        border-radius: .25rem;
        background: #fff;
        max-height: 320px;
        overflow-y: auto;
    }
    .statistic-picker-wrapper ul li {
        margin: 0;
        border-bottom: 1px solid #f1f3f5;
    }
    .statistic-picker-wrapper ul li:last-child { border-bottom: 0; }
    .statistic-picker-wrapper ul li label {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        margin: 0;
        cursor: pointer;
        font-weight: 400;
        font-size: 1.05rem;
        line-height: 1.4;
    }
    .statistic-picker-wrapper ul li label:hover { background: #f8f9fa; }
    .statistic-picker-wrapper ul li input[type="checkbox"] {
        margin: 0 12px 0 0;
        width: 18px;
        height: 18px;
        accent-color: #007bff;
        flex-shrink: 0;
    }
</style>
